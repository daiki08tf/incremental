<title>漂流コロニー</title>
<link rel="stylesheet" href="style.css" />

<header class="header">
  <h1 class="title">漂流コロニー <span class="title-sub">-Ashfall-</span></h1>
  <div class="planet-badge">
    <span class="pixel-icon icon-ship" aria-hidden="true"></span>
    <span id="planet-count">第1惑星</span>
  </div>
</header>

<main class="layout">
  <!-- 左カラム: 資源 + 生存者 -->
  <section class="panel panel-resources">
    <h2 class="panel-title">資源</h2>
    <ul class="resource-list" id="resource-list">
      <!-- JSで生成 -->
    </ul>

    <h2 class="panel-title">生存者</h2>
    <div class="survivor-box">
      <div class="survivor-count">
        <span class="pixel-icon icon-survivor" aria-hidden="true"></span>
        <span id="survivor-count-text">0 / 5</span>
      </div>
      <button id="btn-accept-survivor" class="btn btn-small">迎え入れる (<span id="survivor-cost">-</span> 木材)</button>
      <div class="survivor-assign" id="survivor-assign-list">
        <!-- JSで生成 -->
      </div>
    </div>
  </section>

  <!-- 中央カラム: クリック + 建物 -->
  <section class="panel panel-main">
    <h2 class="panel-title">採集</h2>
    <button id="btn-click" class="click-area">
      <span class="pixel-icon icon-wood icon-large" aria-hidden="true"></span>
      <div>木材を集める</div>
      <div class="click-power">+<span id="click-amount">1</span> / クリック</div>
    </button>
    <button id="btn-upgrade-click" class="btn btn-small">
      採集効率アップ (<span id="click-upgrade-cost">-</span> 木材) — Lv.<span id="click-level">0</span>
    </button>

    <h2 class="panel-title">建物</h2>
    <ul class="building-list" id="building-list">
      <!-- JSで生成 -->
    </ul>
  </section>

  <!-- 右カラム: プレステージ + 実績 -->
  <section class="panel panel-side">
    <h2 class="panel-title">脱出船 &amp; 惑星ジャンプ</h2>
    <div class="prestige-box">
      <div class="prestige-req" id="prestige-requirements">必要資源を集めています…</div>
      <div class="prestige-carry">
        同行させる生存者:
        <button id="carry-minus" class="btn btn-tiny">-</button>
        <span id="carry-count">0</span>
        <button id="carry-plus" class="btn btn-tiny">+</button>
        人
      </div>
      <button id="btn-prestige" class="btn btn-warning" disabled>脱出船を発進する</button>
      <div class="knowledge-display">
        知識ポイント: <span id="knowledge-count">0</span>
      </div>
      <ul class="upgrade-list" id="prestige-upgrade-list">
        <!-- JSで生成 -->
      </ul>
    </div>

    <h2 class="panel-title">実績</h2>
    <ul class="achievement-list" id="achievement-list">
      <!-- JSで生成 -->
    </ul>
  </section>
</main>

<footer class="footer">
  <div class="log-panel" id="log-panel"></div>
  <div class="save-panel">
    <button id="btn-export" class="btn btn-small">セーブコードを発行</button>
    <button id="btn-import" class="btn btn-small">コードを読み込む</button>
    <button id="btn-reset" class="btn btn-small btn-danger">最初からやり直す</button>
    <span class="save-status" id="save-status"></span>
  </div>
</footer>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <h3 id="modal-title">セーブコード</h3>
    <textarea id="modal-textarea" rows="4"></textarea>
    <div class="modal-note" id="modal-note"></div>
    <div class="modal-actions">
      <button id="modal-confirm" class="btn btn-small">OK</button>
      <button id="modal-cancel" class="btn btn-small">閉じる</button>
    </div>
  </div>
</div>

<script src="src/state.js"></script>
<script src="src/buildings.js"></script>
<script src="src/resources.js"></script>
<script src="src/survivors.js"></script>
<script src="src/prestige.js"></script>
<script src="src/achievements.js"></script>
<script src="src/save.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
