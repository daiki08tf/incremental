<title>漂流コロニー</title>
<style>
/* =========================================================
   漂流コロニー -Ashfall- : ドット絵風スタイル
   画像素材は使わず、CSSの図形・box-shadowのみで表現する。
   ========================================================= */

:root {
  color-scheme: dark;
  --bg: #1b1712;
  --bg-panel: #26201a;
  --bg-panel-alt: #2f2820;
  --border: #59493a;
  --border-light: #7a6650;
  --text: #e8dcc8;
  --text-dim: #a7967f;
  --accent: #e08a3c;
  --accent-dim: #8a5a2a;
  --wood: #b8804a;
  --metal: #9aa5ad;
  --food: #d7c15a;
  --power: #e8d34a;
  --components: #6fb3c9;
  --danger: #c85c4a;
  --ok: #6fbf6f;
  --font-main: "Courier New", "MS Gothic", monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  image-rendering: pixelated;
}

button {
  font-family: inherit;
}

/* ---------- レイアウト ---------- */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--bg-panel);
  border-bottom: 3px solid var(--border);
}

.title {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 1px;
}

.title-sub {
  color: var(--accent);
  font-size: 0.9rem;
}

.planet-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--bg-panel-alt);
  border: 2px solid var(--border-light);
}

/* 惑星環境のコンパクト表示(現在 + ジャンプ可能時のみ次の惑星) */
.planet-panel {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 3px;
  text-align: right;
}

.planet-current {
  font-size: 0.72rem;
  color: var(--text);
}

.planet-next {
  font-size: 0.7rem;
  color: var(--accent);
}

.planet-next:empty {
  display: none;
}

@media (max-width: 480px) {
  .header {
    flex-wrap: wrap;
    gap: 6px;
  }

  .planet-panel {
    align-items: flex-start;
    text-align: left;
  }

  .planet-current,
  .planet-next {
    font-size: 0.66rem;
  }
}

/* ---------- 次の目標 ---------- */

.goal-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  background: var(--bg-panel-alt);
  border-bottom: 3px solid var(--border);
}

.goal-label {
  flex-shrink: 0;
  padding: 1px 8px;
  font-size: 0.72rem;
  color: var(--bg);
  background: var(--accent);
  border: 2px solid var(--accent-dim);
}

.goal-text {
  font-size: 0.85rem;
  color: var(--text);
}

.layout {
  display: grid;
  grid-template-columns: 240px 1fr 300px;
  gap: 12px;
  padding: 12px;
  align-items: start;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }
}

.panel {
  background: var(--bg-panel);
  border: 3px solid var(--border);
  padding: 10px;
}

.panel-title {
  margin: 6px 0;
  font-size: 0.85rem;
  color: var(--accent);
  border-bottom: 2px dashed var(--border-light);
  padding-bottom: 4px;
}

/* ---------- 資源リスト ---------- */

.resource-list {
  list-style: none;
  margin: 0 0 10px 0;
  padding: 0;
}

.resource-list li {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  font-size: 0.85rem;
  border-bottom: 1px solid var(--border);
}

.resource-list .amount {
  margin-left: auto;
  font-weight: bold;
}

.resource-list .rate {
  color: var(--text-dim);
  font-size: 0.75rem;
}

/* ---------- クリックエリア ---------- */

.click-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 18px 10px;
  background: var(--bg-panel-alt);
  border: 3px solid var(--border-light);
  color: var(--text);
  cursor: pointer;
  margin-bottom: 8px;
}

.click-area:active {
  transform: translateY(2px);
  background: var(--accent-dim);
}

.click-power {
  font-size: 0.8rem;
  color: var(--text-dim);
}

/* ---------- ボタン共通 ---------- */

.btn {
  background: var(--bg-panel-alt);
  border: 2px solid var(--border-light);
  color: var(--text);
  padding: 6px 10px;
  cursor: pointer;
  font-size: 0.8rem;
  margin: 3px 0;
}

.btn:hover:not(:disabled) {
  border-color: var(--accent);
  color: var(--accent);
}

.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-small {
  width: 100%;
}

.btn-tiny {
  width: 28px;
  padding: 2px 0;
}

.btn-warning {
  border-color: var(--accent);
  color: var(--accent);
}

.btn-danger {
  border-color: var(--danger);
  color: var(--danger);
}

/* ---------- 建物リスト ---------- */

.building-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.building-item {
  display: grid;
  grid-template-columns: 28px 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 6px 4px;
  border-bottom: 1px solid var(--border);
}

.building-item .b-name {
  font-size: 0.85rem;
}

.building-item .b-detail {
  font-size: 0.7rem;
  color: var(--text-dim);
}

.building-item .b-milestone {
  font-size: 0.68rem;
  color: var(--accent);
}

.building-item.locked {
  opacity: 0.55;
}

.building-item.locked .b-name {
  color: var(--text-dim);
}

.locked-tag {
  font-size: 0.68rem;
  color: var(--text-dim);
  border: 2px solid var(--border);
  padding: 2px 6px;
  white-space: nowrap;
}

/* ---------- 生存者 ---------- */

.survivor-box {
  margin-bottom: 6px;
}

.survivor-count {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.survivor-assign {
  margin-top: 6px;
  font-size: 0.75rem;
}

.assign-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
}

.assign-row .assign-name {
  flex: 1;
}

/* ---------- プレステージ ---------- */

.prestige-box {
  margin-bottom: 10px;
}

.prestige-req {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 6px;
}

.prestige-carry {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8rem;
  margin-bottom: 6px;
}

.knowledge-display {
  margin: 8px 0;
  font-size: 0.85rem;
  color: var(--components);
}

.upgrade-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.upgrade-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
}

/* ---------- 実績 ---------- */

.achievement-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 220px;
  overflow-y: auto;
}

.achievement-item {
  font-size: 0.75rem;
  padding: 4px 2px;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
}

.achievement-item.unlocked {
  color: var(--ok);
}

/* ---------- フッター ---------- */

.footer {
  padding: 10px 16px 20px;
  border-top: 3px solid var(--border);
  background: var(--bg-panel);
}

.log-panel {
  height: 90px;
  overflow-y: auto;
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-bottom: 8px;
  border: 2px solid var(--border);
  padding: 6px;
  background: var(--bg);
}

.log-panel .log-line {
  padding: 1px 0;
}

.save-panel {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.save-panel .btn {
  width: auto;
}

.save-status {
  font-size: 0.75rem;
  color: var(--text-dim);
}

/* ---------- モーダル ---------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}

.modal-overlay[hidden] {
  display: none;
}

.modal {
  background: var(--bg-panel);
  border: 3px solid var(--border-light);
  padding: 16px;
  width: min(90vw, 480px);
}

.modal textarea {
  width: 100%;
  background: var(--bg);
  color: var(--text);
  border: 2px solid var(--border);
  font-family: var(--font-main);
  font-size: 0.8rem;
  padding: 6px;
}

.modal-note {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin: 6px 0;
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* =========================================================
   ドット絵風アイコン(CSSのみ)
   小さな図形の組み合わせで簡易的なピクセルアート風に見せる。
   ========================================================= */

.pixel-icon {
  display: inline-block;
  width: 14px;
  height: 14px;
  position: relative;
  flex-shrink: 0;
}

.icon-large {
  width: 40px;
  height: 40px;
}

/* 木材: 三角の樹冠 + 幹 */
.icon-wood {
  background:
    linear-gradient(var(--wood), var(--wood)) bottom / 100% 30% no-repeat,
    conic-gradient(from 180deg at 50% 100%, transparent 25%, #6f9c4c 25% 75%, transparent 75%) top / 100% 75% no-repeat;
}

/* 金属: 角ばった鉱石の塊 */
.icon-metal {
  background: var(--metal);
  clip-path: polygon(20% 0%, 80% 0%, 100% 30%, 100% 70%, 80% 100%, 20% 100%, 0% 70%, 0% 30%);
}
.icon-metal::after {
  content: "";
  position: absolute;
  inset: 30%;
  background: #6c757c;
}

/* 食料: 麦の束を縦線で簡略表現 */
.icon-food {
  background: repeating-linear-gradient(
    90deg,
    var(--food) 0 2px,
    transparent 2px 5px
  );
}

/* 電力: 稲妻(clip-pathのジグザグ) */
.icon-power {
  background: var(--power);
  clip-path: polygon(60% 0%, 20% 55%, 45% 55%, 35% 100%, 80% 45%, 55% 45%);
}

/* 部品: 歯車(角の飛び出た八角形 + 中心の穴) */
.icon-components {
  background: var(--components);
  clip-path: polygon(
    35% 0%, 65% 0%, 65% 15%, 85% 25%, 100% 35%, 85% 45%,
    85% 55%, 100% 65%, 85% 75%, 65% 85%, 65% 100%, 35% 100%,
    35% 85%, 15% 75%, 0% 65%, 15% 55%, 15% 45%, 0% 35%,
    15% 25%, 35% 15%
  );
}
.icon-components::after {
  content: "";
  position: absolute;
  inset: 35%;
  background: var(--bg-panel);
}

/* 生存者: 単純な人型シルエット */
.icon-survivor {
  background:
    radial-gradient(circle at 50% 22%, var(--text) 0 30%, transparent 31%) top / 100% 45% no-repeat,
    linear-gradient(var(--text), var(--text)) bottom / 60% 55% no-repeat;
  margin-left: 40px;
}

/* 脱出船: 台形の船体 */
.icon-ship {
  background: var(--accent);
  clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
}
</style>

<header class="header">
  <h1 class="title">漂流コロニー <span class="title-sub">-Ashfall-</span></h1>
  <div class="planet-panel">
    <div class="planet-badge">
      <span class="pixel-icon icon-ship" aria-hidden="true"></span>
      <span id="planet-count">第1惑星</span>
    </div>
    <div class="planet-current" id="planet-current">惑星: 標準環境 — 変動なし</div>

</header>

<div class="goal-bar">
  <span class="goal-label">次の目標</span>

</div>

<main class="layout">
  <!-- 左カラム: 資源 + 生存者 -->
  <section class="panel panel-resources">
    <h2 class="panel-title">資源</h2>

      </div>

  <!-- 中央カラム: クリック + 建物 -->
  <section class="panel panel-main">

      </div>

  <div class="log-panel" id="log-panel"></div>
  <div class="save-panel">
    <button id="btn-export" class="btn btn-small">セーブコードを発行</button>
    <button id="btn-import" class="btn btn-small">コードを読み込む</button>
    <button id="btn-reset" class="btn btn-small btn-danger">最初からやり直す</button>
    <span class="save-status" id="save-status"></span>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <h3 id="modal-title">セーブコード</h3>

    <div class="modal-note" id="modal-note"></div>
    <div class="modal-actions">
      <button id="modal-confirm" class="btn btn-small">OK</button>
      <button id="modal-cancel" class="btn btn-small">閉じる</button>
    </div>

</div>

<script>
/* ---- src/state.js ---- */
/* =========================================================
   state.js
   ゲーム状態の定義と初期値。
   ========================================================= */
(function (Game) {
  'use strict';

  Game.RESOURCE_KEYS = ['wood', 'metal', 'food', 'power', 'components'];
  Game.BUILDING_KEYS = ['woodcutter', 'miner', 'farm', 'generator', 'refinery'];
  Game.PRESTIGE_UPGRADE_KEYS = ['productionBoost', 'startingWood', 'populationCap', 'foodEfficiency'];

  Game.FOOD_PER_SURVIVOR = 0.15; // 1人あたりの食料消費/秒
  Game.BASE_POPULATION_CAP = 5;
  Game.MAX_CARRY_SURVIVORS = 3;
  Game.SAVE_KEY = 'ashfall_save_v1';
  Game.AUTOSAVE_INTERVAL_MS = 10000;
  Game.OFFLINE_MAX_SECONDS = 8 * 60 * 60; // 最大8時間分
  Game.OFFLINE_EFFICIENCY = 0.5;

  function createInitialState() {
    return {
      resources: { wood: 0, metal: 0, food: 0, power: 0, components: 0 },
      buildings: { woodcutter: 0, miner: 0, farm: 0, generator: 0, refinery: 0 },
      survivors: {
        total: 0,
        assigned: { woodcutter: 0, miner: 0, farm: 0, generator: 0, refinery: 0 },
      },
      clickLevel: 0,
      prestige: {
        count: 0,
        knowledge: 0,
        upgrades: { productionBoost: 0, startingWood: 0, populationCap: 0, foodEfficiency: 0 },
      },
      achievements: {},
      stats: {
        totalWoodCollected: 0,
        totalMetalCollected: 0,
        totalComponentsCollected: 0,
        totalClicks: 0,
        totalKnowledgeEarned: 0,
      },
      lastActiveTime: Date.now(),
    };
  }

  Game.createInitialState = createInitialState;
})(window.Game = window.Game || {});

/* ---- src/buildings.js ---- */
/* =========================================================
   buildings.js
   建物の定義、コスト計算、購入処理、
   マイルストーンと解放条件の正本。

   マイルストーン:
   棟数が 10 / 25 / 50 に達すると、その建物の「正の生産量」に
   最終出力倍率(累積乗算ではない)が掛かる。
   例) 9棟=×1.00, 10棟=×1.15, 24棟=×1.15, 25棟=×1.33,
       49棟=×1.33, 50棟=×1.60
   消費量(発電機の木材消費、精製所の金属消費、電力需要)には掛けない。

   倍率は初回ジャンプの実測(手動クリック併用の標準プレイ)で決めている:
   目標は初回ジャンプ27〜30分・部品500からの空白8分以下。
   実測 1.15/1.33/1.60 で 27分47秒 / 空白7分57秒 / KP8。
   (50棟の倍率は初回ジャンプでは全建物が50棟に届かないため影響しない)
   ========================================================= */
(function (Game) {
  'use strict';

  var DEFAULT_MILESTONES = [
    { count: 10, multiplier: 1.15 },
    { count: 25, multiplier: 1.33 },
    { count: 50, multiplier: 1.60 },
  ];

  Game.BUILDING_DEFS = {
    woodcutter: {
      name: '伐採小屋',
      icon: 'icon-wood',
      baseCost: { wood: 10 },
      costGrowth: 1.13,
      output: { wood: 0.6 },
      consumes: {},
      milestones: DEFAULT_MILESTONES,
      unlockText: '最初から建設できる',
      unlockProgress: function () { return { current: 0, required: 0 }; },
    },
    miner: {
      name: '採掘機',
      icon: 'icon-metal',
      baseCost: { wood: 60 },
      costGrowth: 1.14,
      output: { metal: 0.35 },
      consumes: {},
      milestones: DEFAULT_MILESTONES,
      unlockText: '伐採小屋 1棟',
      unlockProgress: function (state) { return { current: state.buildings.woodcutter, required: 1 }; },
    },
    farm: {
      name: '農場',
      icon: 'icon-food',
      baseCost: { wood: 90, metal: 15 },
      costGrowth: 1.14,
      output: { food: 0.5 },
      consumes: {},
      milestones: DEFAULT_MILESTONES,
      unlockText: '生存者 1人',
      unlockProgress: function (state) { return { current: state.survivors.total, required: 1 }; },
    },
    generator: {
      name: '発電機',
      icon: 'icon-power',
      baseCost: { metal: 120 },
      costGrowth: 1.15,
      output: { power: 1.2 },
      consumes: { wood: 0.3 },
      milestones: DEFAULT_MILESTONES,
      unlockText: '採掘機 3棟',
      unlockProgress: function (state) { return { current: state.buildings.miner, required: 3 }; },
    },
    refinery: {
      name: '精製所',
      icon: 'icon-components',
      baseCost: { metal: 220 },
      costGrowth: 1.16,
      output: { components: 0.15 },
      consumes: { metal: 0.6, power: 1 },
      milestones: DEFAULT_MILESTONES,
      unlockText: '発電機 1棟',
      unlockProgress: function (state) { return { current: state.buildings.generator, required: 1 }; },
    },
  };

  // 解放進捗(建物定義の unlockProgress が正本。UI側で条件を再定義しない)
  Game.getUnlockProgress = function (key, state) {
    var def = Game.BUILDING_DEFS[key];
    if (!def) return { text: '', current: 0, required: 0, done: false, ratio: 0 };
    var raw = def.unlockProgress ? def.unlockProgress(state) : { current: 0, required: 0 };
    var required = Math.max(0, raw.required || 0);
    var current = Math.max(0, raw.current || 0);
    return {
      text: def.unlockText || '',
      current: required > 0 ? Math.min(current, required) : current,
      required: required,
      done: current >= required,
      ratio: required > 0 ? Math.min(1, current / required) : 1,
    };
  };

  Game.isBuildingUnlocked = function (state, key) {
    return Game.getUnlockProgress(key, state).done;
  };

  // 現在の棟数に対応する「最終出力倍率」(累積乗算しない)
  Game.getBuildingOutputMultiplier = function (key, state) {
    var def = Game.BUILDING_DEFS[key];
    if (!def || !def.milestones) return 1;
    var level = (state.buildings && state.buildings[key]) || 0;
    var multiplier = 1;
    def.milestones.forEach(function (milestone) {
      if (level >= milestone.count) multiplier = milestone.multiplier;
    });
    return multiplier;
  };

  // 次に到達できるマイルストーン(全て達成済みなら null)
  Game.getNextBuildingMilestone = function (key, state) {
    var def = Game.BUILDING_DEFS[key];
    if (!def || !def.milestones) return null;
    var level = (state.buildings && state.buildings[key]) || 0;
    for (var i = 0; i < def.milestones.length; i++) {
      var milestone = def.milestones[i];
      if (level < milestone.count) {
        return {
          count: milestone.count,
          multiplier: milestone.multiplier,
          level: level,
          remaining: milestone.count - level,
          ratio: milestone.count > 0 ? level / milestone.count : 1,
        };
      }
    }
    return null;
  };

  // 建物 key の次の1レベルにかかるコストを返す
  Game.getBuildingCost = function (key) {
    var state = Game.state;
    var def = Game.BUILDING_DEFS[key];
    var level = state.buildings[key];
    var cost = {};
    Object.keys(def.baseCost).forEach(function (res) {
      cost[res] = def.baseCost[res] * Math.pow(def.costGrowth, level);
    });
    return cost;
  };

  Game.canAfford = function (cost) {
    var state = Game.state;
    return Object.keys(cost).every(function (res) {
      return state.resources[res] >= cost[res];
    });
  };

  Game.spend = function (cost) {
    var state = Game.state;
    Object.keys(cost).forEach(function (res) {
      state.resources[res] -= cost[res];
    });
  };

  Game.buyBuilding = function (key) {
    var def = Game.BUILDING_DEFS[key];
    if (!def || !Game.isBuildingUnlocked(Game.state, key)) return false;
    var cost = Game.getBuildingCost(key);
    if (!Game.canAfford(cost)) return false;
    Game.spend(cost);
    Game.state.buildings[key] += 1;
    Game.checkAchievements();
    Game.render();
    return true;
  };
})(window.Game = window.Game || {});

/* ---- src/planets.js ---- */
/* =========================================================
   planets.js
   惑星環境モディファイアの定義と導出の正本。

   - 惑星は state.prestige.count からのみ導出する。
     state.planet のような新しい保存フィールドは持たない
     (旧セーブ・セーブコード・リロード後も同じ惑星が完全に再現される)。
   - 倍率は「建物の正の生産量」にのみ掛かる。
     消費量(発電機の木材、精製所の金属、電力需要)には掛けない。
   - 手動クリックには掛けない(環境効果は建物生産だけが対象)。
   - 生産計算(resources.js)とUI(ui.js)は必ずこのファイルの
     共通関数を通す。惑星の数値をUI側へ二重定義しない。
   ========================================================= */
(function (Game) {
  'use strict';

  // prestige 0 は標準惑星(第1周、すべて×1.00)。
  // prestige 1 以降は PLANET_DEFS[1..] を順に循環する。
  Game.PLANET_DEFS = [
    {
      id: 'standard',
      name: '標準環境',
      description: '目立った偏りのない惑星',
      modifiers: { wood: 1.00, metal: 1.00, food: 1.00, power: 1.00, components: 1.00 },
    },
    {
      id: 'ore',
      name: '鉱脈惑星',
      description: '金属が豊富だが森林が少ない',
      // 金属 +25% は実測 -18.4%(Standard比)で ±15% 目安を外れたため、
      // シミュレータで -13.0% になる +18% まで下げている。
      modifiers: { metal: 1.18, wood: 0.90 },
    },
    {
      // Candidate B 再調整: 電力/食料は現行経済で効果が計測されないため、
      // 実際に効く木材(テンポ)と金属(律速)の組み合わせへ変更。
      id: 'forest',
      name: '森林惑星',
      description: '木材が豊富だが鉱脈が乏しい',
      modifiers: { wood: 1.25, metal: 0.85 },
    },
    {
      // Candidate B 再調整: 木材で広く建てられるが精製(部品)が弱く、
      // 速く脱出できる代わりに知識ポイントが最少になる。
      id: 'corroded',
      name: '腐食惑星',
      description: '植物は育つが機械の劣化が早い',
      modifiers: { wood: 1.20, components: 0.85 },
    },
    {
      id: 'industrial',
      name: '工業遺構惑星',
      description: '部品製造に有利だが電力効率が悪い',
      modifiers: { components: 1.20, power: 0.90 },
    },
  ];

  Game.PLANET_NO_EFFECT_TEXT = '変動なし';
  // 標準惑星(先頭)を除いた循環の長さ
  Game.PLANET_CYCLE_LENGTH = Game.PLANET_DEFS.length - 1;

  // prestige count から惑星 index を導出する唯一の関数。
  //   0 → 0(標準惑星)
  //   1 → 1, 2 → 2, 3 → 3, 4 → 4, 5 → 1, ...
  Game.getPlanetIndex = function (prestigeCount) {
    var count = Math.floor(Number(prestigeCount) || 0);
    if (count <= 0) return 0;
    return ((count - 1) % Game.PLANET_CYCLE_LENGTH) + 1;
  };

  Game.getPlanetByPrestigeCount = function (prestigeCount) {
    return Game.PLANET_DEFS[Game.getPlanetIndex(prestigeCount)];
  };

  Game.getCurrentPlanet = function (state) {
    var count = state && state.prestige ? state.prestige.count : 0;
    return Game.getPlanetByPrestigeCount(count);
  };

  // 次のジャンプで到着する惑星(ジャンプ前の事前表示に使う)
  Game.getNextPlanet = function (state) {
    var count = state && state.prestige ? state.prestige.count : 0;
    return Game.getPlanetByPrestigeCount(count + 1);
  };

  // 建物の正の生産量に掛かる惑星倍率(定義にない資源は×1.00)
  Game.getPlanetResourceMultiplier = function (state, resource) {
    var planet = Game.getCurrentPlanet(state);
    if (!planet || !planet.modifiers) return 1;
    var multiplier = planet.modifiers[resource];
    return (typeof multiplier === 'number' && multiplier > 0) ? multiplier : 1;
  };

  // 表示用の一覧。倍率の正本は PLANET_DEFS のみで、ここは整形だけを行う。
  Game.getPlanetModifierList = function (planet) {
    if (!planet || !planet.modifiers) return [];
    var keys = Game.RESOURCE_KEYS ? Game.RESOURCE_KEYS.slice() : Object.keys(planet.modifiers);
    return keys.filter(function (resource) {
      var multiplier = planet.modifiers[resource];
      return typeof multiplier === 'number' && multiplier !== 1;
    }).map(function (resource) {
      var multiplier = planet.modifiers[resource];
      return {
        resource: resource,
        multiplier: multiplier,
        percent: Math.round((multiplier - 1) * 100),
      };
    });
  };

  // 例) '金属 +25% / 木材 -10%'、変動がなければ '変動なし'
  //     options.separator           区切り文字(既定 ' / ')
  //     options.productionSuffix    true で「金属生産 +25%」のように生産を付ける
  Game.formatPlanetEffects = function (planet, options) {
    options = options || {};
    var separator = options.separator || ' / ';
    var list = Game.getPlanetModifierList(planet);
    if (list.length === 0) return Game.PLANET_NO_EFFECT_TEXT;
    return list.map(function (item) {
      var name = (Game.RESOURCE_NAMES && Game.RESOURCE_NAMES[item.resource]) || item.resource;
      if (options.productionSuffix) name += '生産';
      return name + ' ' + (item.percent > 0 ? '+' : '') + item.percent + '%';
    }).join(separator);
  };
})(window.Game = window.Game || {});

/* ---- src/resources.js ---- */
/* =========================================================
   resources.js
   資源の生産/消費計算(ゲームループの中核)。

   MVPでの簡略化(GDDからの実装上の割り切り):
   - 電力は「貯蔵する資源」ではなく毎tick再計算する瞬間流量として扱う。
     供給(発電機) < 需要(精製所など) の場合、電力を使う建物の稼働率を
     按分で下げる(RimWorldのブラウンアウトの簡易版)。
   - 食料は在庫として扱うが、枯渇時のペナルティは「在庫が0なら生産に
     一律ペナルティ」という単純な閾値式にしている(段階的な計算はしない)。
   ========================================================= */
(function (Game) {
  'use strict';

  Game.FOOD_PENALTY_MULTIPLIER = 0.5; // 食料が尽きているときの生産倍率

  // 実績/永続強化を反映した全体生産倍率
  Game.getGlobalMultiplier = function (state) {
    var prestigeBoost = 1 + 0.05 * state.prestige.upgrades.productionBoost;
    var unlockedCount = Object.keys(state.achievements).filter(function (id) {
      return state.achievements[id];
    }).length;
    var achievementBoost = 1 + 0.02 * unlockedCount;
    return prestigeBoost * achievementBoost;
  };

  Game.getSurvivorBonus = function (state, buildingKey) {
    var assigned = state.survivors.assigned[buildingKey] || 0;
    return 1 + 0.08 * assigned;
  };

  // dtSeconds 分のシミュレーションを1回だけ進める。
  // options.offline === true のときはオフライン算出用に効率を落とす。
  Game.tick = function (dtSeconds, options) {
    options = options || {};
    var state = Game.state;
    var offlineEfficiency = options.offline ? Game.OFFLINE_EFFICIENCY : 1;
    var globalMult = Game.getGlobalMultiplier(state) * offlineEfficiency;
    var foodPenalty = (state.survivors.total > 0 && state.resources.food <= 0)
      ? Game.FOOD_PENALTY_MULTIPLIER
      : 1;

    // 1. 建物ごとの素の生産/消費(電力按分前)を算出
    var raw = {};
    Game.BUILDING_KEYS.forEach(function (key) {
      var def = Game.BUILDING_DEFS[key];
      var level = state.buildings[key];
      var produce = {};
      var consume = {};
      if (level > 0) {
        var survivorBonus = Game.getSurvivorBonus(state, key);
        // マイルストーン倍率・惑星環境倍率は「正の生産量」にのみ掛ける(消費量には掛けない)
        var milestoneMult = Game.getBuildingOutputMultiplier(key, state);
        Object.keys(def.output || {}).forEach(function (res) {
          // 倍率のレイヤー: 素の生産 × 生存者 × 全体 × 建物マイルストーン × 惑星環境
          var planetMult = Game.getPlanetResourceMultiplier(state, res);
          produce[res] = def.output[res] * level * survivorBonus * milestoneMult * globalMult * planetMult * foodPenalty;
        });
        Object.keys(def.consumes || {}).forEach(function (res) {
          consume[res] = def.consumes[res] * level;
        });
      }
      raw[key] = { produce: produce, consume: consume };
    });

    // 2. 電力の需給を計算し、電力を使う建物の稼働率を決める
    var powerSupply = 0;
    var powerDemand = 0;
    Game.BUILDING_KEYS.forEach(function (key) {
      powerSupply += raw[key].produce.power || 0;
      powerDemand += raw[key].consume.power || 0;
    });
    var powerRatio = powerDemand > 0 ? Math.min(1, powerSupply / powerDemand) : 1;

    Game.BUILDING_KEYS.forEach(function (key) {
      var def = Game.BUILDING_DEFS[key];
      var usesPower = def.consumes && def.consumes.power;
      if (!usesPower) return;
      Object.keys(raw[key].produce).forEach(function (res) {
        raw[key].produce[res] *= powerRatio;
      });
      Object.keys(raw[key].consume).forEach(function (res) {
        raw[key].consume[res] *= powerRatio;
      });
    });

    // 3. 資源へ反映
    var delta = { wood: 0, metal: 0, food: 0, power: 0, components: 0 };
    Game.BUILDING_KEYS.forEach(function (key) {
      Object.keys(raw[key].produce).forEach(function (res) {
        delta[res] += raw[key].produce[res] * dtSeconds;
      });
      Object.keys(raw[key].consume).forEach(function (res) {
        delta[res] -= raw[key].consume[res] * dtSeconds;
      });
    });

    // 食料は生存者の維持で消費(食料効率アップで軽減)
    var foodEff = 1 - 0.08 * state.prestige.upgrades.foodEfficiency;
    if (foodEff < 0.2) foodEff = 0.2;
    delta.food -= state.survivors.total * Game.FOOD_PER_SURVIVOR * foodEff * dtSeconds;

    var rates = {};
    Game.RESOURCE_KEYS.forEach(function (res) {
      if (res === 'power') {
        // 電力は貯蔵しない瞬間流量として表示用に上書き(需給差の目安)
        state.resources.power = powerSupply * powerRatio - powerDemand * powerRatio;
        rates.power = state.resources.power;
        return;
      }
      state.resources[res] = Math.max(0, state.resources[res] + delta[res]);
      rates[res] = dtSeconds > 0 ? delta[res] / dtSeconds : 0;
    });
    Game.lastRates = rates;

    // 統計(実績判定用)
    if (delta.wood > 0) state.stats.totalWoodCollected += delta.wood;
    if (delta.metal > 0) state.stats.totalMetalCollected += delta.metal;
    var componentsProduced = (raw.refinery.produce.components || 0) * dtSeconds;
    if (componentsProduced > 0) state.stats.totalComponentsCollected += componentsProduced;

    Game.lastPowerInfo = { supply: powerSupply, demand: powerDemand, ratio: powerRatio };
  };

  // 手動クリックによる木材採集
  Game.getClickAmount = function () {
    var state = Game.state;
    var globalMult = Game.getGlobalMultiplier(state);
    return (1 + state.clickLevel) * globalMult;
  };

  Game.doManualClick = function () {
    var state = Game.state;
    var amount = Game.getClickAmount();
    state.resources.wood += amount;
    state.stats.totalWoodCollected += amount;
    state.stats.totalClicks += 1;
    Game.checkAchievements();
    Game.render();
  };

  Game.getClickUpgradeCost = function () {
    return Math.ceil(15 * Math.pow(1.6, Game.state.clickLevel));
  };

  Game.buyClickUpgrade = function () {
    var cost = Game.getClickUpgradeCost();
    if (Game.state.resources.wood < cost) return false;
    Game.state.resources.wood -= cost;
    Game.state.clickLevel += 1;
    Game.render();
    return true;
  };
})(window.Game = window.Game || {});

/* ---- src/survivors.js ---- */
/* =========================================================
   survivors.js
   生存者の受け入れと建物への割り当て(簡略版)。
   ========================================================= */
(function (Game) {
  'use strict';

  Game.getPopulationCap = function (state) {
    return Game.BASE_POPULATION_CAP + state.prestige.upgrades.populationCap;
  };

  Game.getSurvivorAcceptCost = function () {
    var n = Game.state.survivors.total;
    return Math.ceil(20 * Math.pow(1.5, n));
  };

  Game.acceptSurvivor = function () {
    var state = Game.state;
    var cap = Game.getPopulationCap(state);
    if (state.survivors.total >= cap) return false;
    var cost = Game.getSurvivorAcceptCost();
    if (state.resources.wood < cost) return false;
    state.resources.wood -= cost;
    state.survivors.total += 1;
    Game.checkAchievements();
    Game.render();
    return true;
  };

  Game.getUnassignedSurvivors = function (state) {
    var assignedTotal = Game.BUILDING_KEYS.reduce(function (sum, key) {
      return sum + (state.survivors.assigned[key] || 0);
    }, 0);
    return state.survivors.total - assignedTotal;
  };

  Game.assignSurvivor = function (buildingKey) {
    var state = Game.state;
    if (state.buildings[buildingKey] <= 0) return false;
    if (Game.getUnassignedSurvivors(state) <= 0) return false;
    state.survivors.assigned[buildingKey] = (state.survivors.assigned[buildingKey] || 0) + 1;
    Game.render();
    return true;
  };

  Game.unassignSurvivor = function (buildingKey) {
    var state = Game.state;
    if ((state.survivors.assigned[buildingKey] || 0) <= 0) return false;
    state.survivors.assigned[buildingKey] -= 1;
    Game.render();
    return true;
  };
})(window.Game = window.Game || {});

/* ---- src/prestige.js ---- */
/* =========================================================
   prestige.js
   脱出船の建造条件、惑星ジャンプ(プレステージ)処理、
   知識ポイントによる永続強化。
   ========================================================= */
(function (Game) {
  'use strict';

  Game.ESCAPE_REQUIREMENTS = { components: 500, metal: 800 };

  Game.PRESTIGE_UPGRADE_DEFS = {
    productionBoost: { name: '生産効率 +5%', baseCost: 3, growth: 1.6, max: 20 },
    startingWood: { name: '開始時の木材 +100', baseCost: 2, growth: 1.5, max: 20 },
    populationCap: { name: '生存者の上限 +1', baseCost: 4, growth: 1.7, max: 15 },
    foodEfficiency: { name: '食料消費 -8%', baseCost: 3, growth: 1.6, max: 5 },
  };

  Game.canPrestige = function (state) {
    return state.resources.components >= Game.ESCAPE_REQUIREMENTS.components
      && state.resources.metal >= Game.ESCAPE_REQUIREMENTS.metal;
  };

  // 脱出条件の達成度。部品と金属の両方が必要なので、進捗率は
  // 「より遅れている方(ボトルネック)」= 両条件の達成率の最小値で表す。
  // 必要量の正本は ESCAPE_REQUIREMENTS で、UI側では再定義しない。
  Game.getEscapeProgress = function (state) {
    var resources = {};
    var ratios = [];
    Object.keys(Game.ESCAPE_REQUIREMENTS).forEach(function (res) {
      var required = Game.ESCAPE_REQUIREMENTS[res];
      var current = (state.resources && state.resources[res]) || 0;
      var ratio = required > 0 ? Math.min(1, current / required) : 1;
      resources[res] = {
        current: current,
        required: required,
        ratio: ratio,
        done: current >= required,
      };
      ratios.push(ratio);
    });
    return {
      resources: resources,
      ratio: ratios.length > 0 ? Math.min.apply(null, ratios) : 1,
      done: Game.canPrestige(state),
    };
  };

  Game.calcKnowledgeGain = function (state) {
    var score = (state.resources.components * 2 + state.resources.metal) / 40;
    return Math.max(1, Math.floor(Math.sqrt(score)));
  };

  // 惑星ジャンプを実行する。carryCount は同行させる生存者の人数(0〜3)。
  Game.doPrestige = function (carryCount) {
    var state = Game.state;
    if (!Game.canPrestige(state)) return false;

    var kpGained = Game.calcKnowledgeGain(state);
    var carry = Math.max(0, Math.min(Game.MAX_CARRY_SURVIVORS, carryCount || 0, state.survivors.total));

    state.resources = {
      wood: 100 * state.prestige.upgrades.startingWood,
      metal: 0,
      food: 0,
      power: 0,
      components: 0,
    };
    Game.BUILDING_KEYS.forEach(function (key) {
      state.buildings[key] = 0;
    });
    state.survivors.total = carry;
    Game.BUILDING_KEYS.forEach(function (key) {
      state.survivors.assigned[key] = 0;
    });
    state.clickLevel = 0;

    state.prestige.count += 1;
    state.prestige.knowledge += kpGained;
    state.stats.totalKnowledgeEarned += kpGained;

    // 到着した惑星と環境効果をログに残す(惑星名・効果は planets.js が正本)
    var planet = Game.getCurrentPlanet(state);
    Game.addLog(
      '第' + (state.prestige.count + 1) + '惑星「' + planet.name + '」へ到着。'
      + Game.formatPlanetEffects(planet, { separator: '、', productionSuffix: true })
      + '。(知識 +' + kpGained + ')'
    );
    Game.checkAchievements();
    Game.render();
    return true;
  };

  Game.getPrestigeUpgradeCost = function (key) {
    var def = Game.PRESTIGE_UPGRADE_DEFS[key];
    var level = Game.state.prestige.upgrades[key];
    return Math.ceil(def.baseCost * Math.pow(def.growth, level));
  };

  Game.buyPrestigeUpgrade = function (key) {
    var state = Game.state;
    var def = Game.PRESTIGE_UPGRADE_DEFS[key];
    var level = state.prestige.upgrades[key];
    if (level >= def.max) return false;
    var cost = Game.getPrestigeUpgradeCost(key);
    if (state.prestige.knowledge < cost) return false;
    state.prestige.knowledge -= cost;
    state.prestige.upgrades[key] += 1;
    Game.render();
    return true;
  };
})(window.Game = window.Game || {});

/* ---- src/achievements.js ---- */
/* =========================================================
   achievements.js
   実績の定義と判定。
   実績はLocalStorageにのみ保存し、セーブコードには含めない
   (GDD 7章・9章のハイブリッド仕様)。
   ========================================================= */
(function (Game) {
  'use strict';

  Game.ACHIEVEMENT_DEFS = [
    { id: 'first_click', name: '最初の一歩', desc: '木材を初めて手動で集めた', check: function (s) { return s.stats.totalClicks >= 1; } },
    { id: 'first_building', name: '拠点の礎', desc: '初めて建物を建てた', check: function (s) { return Game.BUILDING_KEYS.some(function (k) { return s.buildings[k] >= 1; }); } },
    { id: 'first_survivor', name: '仲間', desc: '初めて生存者を迎え入れた', check: function (s) { return s.survivors.total >= 1; } },
    { id: 'clicks_100', name: '働き者', desc: 'クリックを100回行った', check: function (s) { return s.stats.totalClicks >= 100; } },
    { id: 'wood_1000', name: '木こり', desc: '木材を累計1000集めた', check: function (s) { return s.stats.totalWoodCollected >= 1000; } },
    { id: 'metal_500', name: '採掘者', desc: '金属を累計500集めた', check: function (s) { return s.stats.totalMetalCollected >= 500; } },
    { id: 'components_100', name: '技師', desc: '部品を累計100生産した', check: function (s) { return s.stats.totalComponentsCollected >= 100; } },
    { id: 'survivors_5', name: '小さな集落', desc: '生存者が5人になった', check: function (s) { return s.survivors.total >= 5; } },
    { id: 'building_lvl10', name: '拡張の証', desc: 'いずれかの建物をLv.10にした', check: function (s) { return Game.BUILDING_KEYS.some(function (k) { return s.buildings[k] >= 10; }); } },

/* ---- src/save.js ---- */
/* =========================================================
   save.js
   保存の二本立て:
   1. LocalStorage自動保存(実績・統計を含む完全な状態)
   2. 「ふっかつのじゅもん」型セーブコード(主要パラメータのみ、
      精度優先。実績・統計は含めない = 端末ごとの記録として扱う)
   ========================================================= */
(function (Game) {
  'use strict';

  // ---------- LocalStorage ----------

  Game.saveToLocalStorage = function () {
    try {
      Game.state.lastActiveTime = Date.now();
      window.localStorage.setItem(Game.SAVE_KEY, JSON.stringify(Game.state));
      return true;
    } catch (e) {
      console.error('保存に失敗しました', e);
      return false;
    }
  };

  Game.loadFromLocalStorage = function () {
    try {
      var raw = window.localStorage.getItem(Game.SAVE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return Game.normalizeState(parsed);
    } catch (e) {
      console.error('読み込みに失敗しました', e);
      return null;
    }
  };

  // 古いセーブや壊れたJSONに欠けているフィールドを初期値で補完する
  Game.normalizeState = function (parsed) {
    var fresh = Game.createInitialState();
    var state = Object.assign({}, fresh, parsed);
    state.resources = Object.assign({}, fresh.resources, parsed.resources);
    state.buildings = Object.assign({}, fresh.buildings, parsed.buildings);
    state.survivors = Object.assign({}, fresh.survivors, parsed.survivors);
    state.survivors.assigned = Object.assign({}, fresh.survivors.assigned, parsed.survivors && parsed.survivors.assigned);
    state.prestige = Object.assign({}, fresh.prestige, parsed.prestige);
    state.prestige.upgrades = Object.assign({}, fresh.prestige.upgrades, parsed.prestige && parsed.prestige.upgrades);
    state.achievements = Object.assign({}, parsed.achievements);
    state.stats = Object.assign({}, fresh.stats, parsed.stats);
    return state;
  };

  // ---------- セーブコード ----------

  function toBase36(n) {
    return Math.max(0, Math.round(n)).toString(36);
  }

  function checksum(str) {
    var sum = 0;
    for (var i = 0; i < str.length; i++) {
      sum = (sum * 31 + str.charCodeAt(i)) >>> 0;
    }
    return sum.toString(36).slice(-4);
  }

  Game.encodeSaveCode = function (state) {
    var nums = [];
    Game.RESOURCE_KEYS.forEach(function (k) { nums.push(state.resources[k] * 100); });
    Game.BUILDING_KEYS.forEach(function (k) { nums.push(state.buildings[k]); });
    nums.push(state.survivors.total);
    Game.BUILDING_KEYS.forEach(function (k) { nums.push(state.survivors.assigned[k] || 0); });
    nums.push(state.clickLevel);
    nums.push(state.prestige.count);
    nums.push(state.prestige.knowledge * 100);
    Game.PRESTIGE_UPGRADE_KEYS.forEach(function (k) { nums.push(state.prestige.upgrades[k]); });
    nums.push(Math.floor(state.lastActiveTime / 1000));

    var body = nums.map(toBase36).join('.');
    return body + '_' + checksum(body);
  };

  Game.decodeSaveCode = function (code) {
    code = (code || '').trim();
    var sepIndex = code.lastIndexOf('_');
    if (sepIndex === -1) throw new Error('コードの形式が正しくありません');
    var body = code.slice(0, sepIndex);
    var sum = code.slice(sepIndex + 1);
    if (checksum(body) !== sum) throw new Error('コードが壊れています(チェックサム不一致)');

    var nums = body.split('.').map(function (s) { return parseInt(s, 36); });
    if (nums.some(function (n) { return Number.isNaN(n); })) {
      throw new Error('コードを読み取れませんでした');
    }

    var state = Game.createInitialState();
    var i = 0;
    Game.RESOURCE_KEYS.forEach(function (k) { state.resources[k] = nums[i++] / 100; });
    Game.BUILDING_KEYS.forEach(function (k) { state.buildings[k] = nums[i++]; });
    state.survivors.total = nums[i++];
    Game.BUILDING_KEYS.forEach(function (k) { state.survivors.assigned[k] = nums[i++]; });
    state.clickLevel = nums[i++];
    state.prestige.count = nums[i++];
    state.prestige.knowledge = nums[i++] / 100;
    Game.PRESTIGE_UPGRADE_KEYS.forEach(function (k) { state.prestige.upgrades[k] = nums[i++]; });
    state.lastActiveTime = nums[i++] * 1000;
    return state;
  };

  // ---------- オフライン進行 ----------

  Game.applyOfflineProgress = function (state) {
    var elapsedMs = Date.now() - (state.lastActiveTime || Date.now());
    var elapsedSeconds = Math.max(0, Math.floor(elapsedMs / 1000));
    if (elapsedSeconds < 5) return 0; // 誤差レベルは無視
    var cappedSeconds = Math.min(elapsedSeconds, Game.OFFLINE_MAX_SECONDS);

    var prevState = Game.state;
    Game.state = state;
    Game.tick(cappedSeconds, { offline: true });
    Game.state = prevState;

    return cappedSeconds;
  };
})(window.Game = window.Game || {});

/* =========================================================
   ui.js
   DOMの描画とイベントバインド。

(function (Game) {
  'use strict';

  Game.RESOURCE_NAMES = { wood: '木材', metal: '金属', food: '食料', power: '電力', components: '部品' };
  Game.logMessages = [];
  Game.carrySelection = 0;
  Game.modalMode = null; // 'export' | 'import'

  // ---------- 数値フォーマット ----------

  Game.formatNumber = function (n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '0';
    var sign = n < 0 ? '-' : '';
    n = Math.abs(n);
    if (n < 1000) return sign + (Number.isInteger(n) ? String(n) : n.toFixed(1));
    var units = ['K', 'M', 'B', 'T', 'Qa', 'Qi'];
    var unitIndex = -1;
    while (n >= 1000 && unitIndex < units.length - 1) {
      n /= 1000;
      unitIndex += 1;
    }
    return sign + n.toFixed(2) + units[unitIndex];
  };

  Game.formatRate = function (n) {
    var sign = n >= 0 ? '+' : '';
    return sign + Game.formatNumber(n) + '/s';
  };

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  // ---------- ログ ----------

  Game.addLog = function (message) {
    var time = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    Game.logMessages.unshift('[' + time + '] ' + message);
    if (Game.logMessages.length > 50) Game.logMessages.length = 50;
    renderLog();
  };

  function renderLog() {
    var panel = document.getElementById('log-panel');
    panel.innerHTML = Game.logMessages
      .map(function (m) { return '<div class="log-line">' + escapeHtml(m) + '</div>'; })
      .join('');
  }

  // ---------- 各パネルの描画 ----------

  function renderResources() {
    var list = document.getElementById('resource-list');
    list.innerHTML = '';
    Game.RESOURCE_KEYS.forEach(function (key) {
      var li = document.createElement('li');

      var icon = document.createElement('span');
      icon.className = 'pixel-icon icon-' + key;

      var name = document.createElement('span');
      name.textContent = Game.RESOURCE_NAMES[key];

      var amount = document.createElement('span');
      amount.className = 'amount';
      amount.textContent = Game.formatNumber(Game.state.resources[key]);

      var rate = document.createElement('span');
      rate.className = 'rate';
      var r = (Game.lastRates && Game.lastRates[key]) || 0;
      rate.textContent = key === 'power' ? '(' + Game.formatNumber(r) + ')' : Game.formatRate(r);

      li.appendChild(icon);
      li.appendChild(name);
      li.appendChild(amount);
      li.appendChild(rate);
      list.appendChild(li);
    });
  }

  function renderClickArea() {
    document.getElementById('click-amount').textContent = Game.formatNumber(Game.getClickAmount());
    document.getElementById('click-level').textContent = Game.state.clickLevel;
    var cost = Game.getClickUpgradeCost();
    document.getElementById('click-upgrade-cost').textContent = Game.formatNumber(cost);
    document.getElementById('btn-upgrade-click').disabled = Game.state.resources.wood < cost;
  }

  function renderBuildings() {
    var state = Game.state;
    var list = document.getElementById('building-list');
    list.innerHTML = '';
    Game.BUILDING_KEYS.forEach(function (key) {
      var def = Game.BUILDING_DEFS[key];
      if (!Game.isBuildingUnlocked(state, key)) {
        // 未解放でも「次に何が建つか」「あと何が必要か」が分かるようにする
        var progress = Game.getUnlockProgress(key, state);
        var lockedLi = document.createElement('li');
        lockedLi.className = 'building-item locked';

        var lockedIcon = document.createElement('span');
        lockedIcon.className = 'pixel-icon ' + def.icon;

        var lockedInfo = document.createElement('div');
        var lockedName = document.createElement('div');
        lockedName.className = 'b-name';
        lockedName.textContent = def.name;
        var lockedDetail = document.createElement('div');
        lockedDetail.className = 'b-detail';
        lockedDetail.textContent = '解放条件: ' + progress.text + '（' + progress.current + '/' + progress.required + '）';
        lockedInfo.appendChild(lockedName);
        lockedInfo.appendChild(lockedDetail);

        var lockedTag = document.createElement('span');
        lockedTag.className = 'locked-tag';
        lockedTag.textContent = '未解放';

        lockedLi.appendChild(lockedIcon);
        lockedLi.appendChild(lockedInfo);
        lockedLi.appendChild(lockedTag);
        list.appendChild(lockedLi);
        return;
      }
      var level = state.buildings[key];
      var cost = Game.getBuildingCost(key);
      var affordable = Game.canAfford(cost);

      var li = document.createElement('li');
      li.className = 'building-item';

      var icon = document.createElement('span');
      icon.className = 'pixel-icon ' + def.icon;

      var info = document.createElement('div');
      var nameEl = document.createElement('div');
      nameEl.className = 'b-name';
      nameEl.textContent = def.name + ' Lv.' + level;

      var detail = document.createElement('div');
      detail.className = 'b-detail';
      var outputParts = Object.keys(def.output).map(function (res) {
        // 表示も生産計算と同じ共通関数を使う(素の生産 × 生存者 × 全体 × マイルストーン × 惑星環境)
        var perSec = def.output[res] * level * Game.getSurvivorBonus(state, key)
          * Game.getBuildingOutputMultiplier(key, state)
          * Game.getGlobalMultiplier(state)
          * Game.getPlanetResourceMultiplier(state, res);
        return '+' + Game.formatNumber(perSec) + Game.RESOURCE_NAMES[res] + '/s';
      });
      var consumeParts = Object.keys(def.consumes).map(function (res) {
        var perSec = def.consumes[res] * level;
        return '-' + Game.formatNumber(perSec) + Game.RESOURCE_NAMES[res] + '/s';
      });
      var costText = Object.keys(cost).map(function (res) {
        return Game.formatNumber(cost[res]) + Game.RESOURCE_NAMES[res];
      }).join(' + ');
      var statusText = (level > 0 ? outputParts.concat(consumeParts).join(' ') : '未建設');
      detail.textContent = statusText + ' / 次のコスト: ' + costText;

      info.appendChild(nameEl);
      info.appendChild(detail);

      // マイルストーンは UI 側で再定義せず、buildings.js の共通関数から取得する
      var milestoneEl = document.createElement('div');
      milestoneEl.className = 'b-milestone';
      var milestoneMult = Game.getBuildingOutputMultiplier(key, state);
      var nextMilestone = Game.getNextBuildingMilestone(key, state);
      if (nextMilestone) {
        milestoneEl.textContent = '生産 ×' + milestoneMult.toFixed(2)
          + ' / 次の節目: ' + nextMilestone.count + '棟まであと' + nextMilestone.remaining
          + '棟（達成で×' + nextMilestone.multiplier.toFixed(2) + '）';
      } else {
        milestoneEl.textContent = '生産 ×' + milestoneMult.toFixed(2) + ' / マイルストーン全達成';
      }
      info.appendChild(milestoneEl);

      var buyBtn = document.createElement('button');
      buyBtn.className = 'btn btn-small';
      buyBtn.textContent = '建設';
      buyBtn.disabled = !affordable;
      buyBtn.addEventListener('click', function () { Game.buyBuilding(key); });

      li.appendChild(icon);
      li.appendChild(info);
      li.appendChild(buyBtn);
      list.appendChild(li);
    });
  }

  function renderSurvivors() {
    var state = Game.state;
    var cap = Game.getPopulationCap(state);
    document.getElementById('survivor-count-text').textContent = state.survivors.total + ' / ' + cap;

    var cost = Game.getSurvivorAcceptCost();
    document.getElementById('survivor-cost').textContent = Game.formatNumber(cost);
    document.getElementById('btn-accept-survivor').disabled = state.survivors.total >= cap || state.resources.wood < cost;

    var assignList = document.getElementById('survivor-assign-list');
    assignList.innerHTML = '';

    var unassigned = Game.getUnassignedSurvivors(state);
    var unassignedRow = document.createElement('div');
    unassignedRow.className = 'assign-row';
    unassignedRow.innerHTML = '<span class="assign-name">未割り当て</span><span>' + unassigned + '人</span>';
    assignList.appendChild(unassignedRow);

    Game.BUILDING_KEYS.forEach(function (key) {
      if (state.buildings[key] <= 0) return;
      var def = Game.BUILDING_DEFS[key];

      var row = document.createElement('div');
      row.className = 'assign-row';

      var name = document.createElement('span');
      name.className = 'assign-name';
      name.textContent = def.name;

      var minus = document.createElement('button');
      minus.className = 'btn btn-tiny';
      minus.textContent = '-';
      minus.disabled = (state.survivors.assigned[key] || 0) <= 0;
      minus.addEventListener('click', function () { Game.unassignSurvivor(key); });

      var count = document.createElement('span');
      count.textContent = state.survivors.assigned[key] || 0;

      var plus = document.createElement('button');
      plus.className = 'btn btn-tiny';
      plus.textContent = '+';
      plus.disabled = unassigned <= 0;
      plus.addEventListener('click', function () { Game.assignSurvivor(key); });

      row.appendChild(name);
      row.appendChild(minus);
      row.appendChild(count);
      row.appendChild(plus);
      assignList.appendChild(row);
    });
  }

  function renderPrestige() {
    var state = Game.state;
    var req = Game.ESCAPE_REQUIREMENTS;

    document.getElementById('prestige-requirements').textContent =
      '必要資源 — 部品: ' + Game.formatNumber(state.resources.components) + ' / ' + Game.formatNumber(req.components)
      + ' ・ 金属: ' + Game.formatNumber(state.resources.metal) + ' / ' + Game.formatNumber(req.metal);

    var maxCarry = Math.min(Game.MAX_CARRY_SURVIVORS, state.survivors.total);
    if (Game.carrySelection > maxCarry) Game.carrySelection = maxCarry;
    document.getElementById('carry-count').textContent = Game.carrySelection;
    document.getElementById('carry-minus').disabled = Game.carrySelection <= 0;
    document.getElementById('carry-plus').disabled = Game.carrySelection >= maxCarry;

    document.getElementById('knowledge-count').textContent = Game.formatNumber(state.prestige.knowledge);
    document.getElementById('btn-prestige').disabled = !Game.canPrestige(state);

    var upgradeList = document.getElementById('prestige-upgrade-list');
    upgradeList.innerHTML = '';
    Game.PRESTIGE_UPGRADE_KEYS.forEach(function (key) {
      var def = Game.PRESTIGE_UPGRADE_DEFS[key];
      var level = state.prestige.upgrades[key];

      var li = document.createElement('li');
      li.className = 'upgrade-item';

      var label = document.createElement('span');
      label.textContent = def.name + ' (Lv.' + level + (level >= def.max ? '/MAX' : '') + ')';

      var btn = document.createElement('button');
      btn.className = 'btn btn-tiny';
      if (level >= def.max) {
        btn.textContent = 'MAX';
        btn.disabled = true;
      } else {
        var cost = Game.getPrestigeUpgradeCost(key);
        btn.textContent = cost;
        btn.disabled = state.prestige.knowledge < cost;
        btn.addEventListener('click', function () { Game.buyPrestigeUpgrade(key); });
      }

      li.appendChild(label);
      li.appendChild(btn);
      upgradeList.appendChild(li);
    });
  }

  function renderAchievements() {
    var list = document.getElementById('achievement-list');
    list.innerHTML = '';
    Game.ACHIEVEMENT_DEFS.forEach(function (def) {
      var unlocked = !!Game.state.achievements[def.id];
      var li = document.createElement('li');
      li.className = 'achievement-item' + (unlocked ? ' unlocked' : '');
      li.textContent = (unlocked ? '[済] ' : '[  ] ') + def.name + ' — ' + def.desc;
      list.appendChild(li);
    });
  }

  function renderHeader() {
    var state = Game.state;
    var planet = Game.getCurrentPlanet(state);
    document.getElementById('planet-count').textContent = '第' + (state.prestige.count + 1) + '惑星';

    // 惑星名と環境効果は planets.js の定義から生成する(UI側で数値を持たない)
    var currentEl = document.getElementById('planet-current');
    if (currentEl) {
      currentEl.textContent = '惑星: ' + planet.name + ' — ' + Game.formatPlanetEffects(planet);
    }

    // ジャンプ可能なときだけ、次の惑星を事前表示する
    var nextEl = document.getElementById('planet-next');
    if (nextEl) {
      if (Game.canPrestige(state)) {
        var next = Game.getNextPlanet(state);
        nextEl.textContent = '次の惑星: ' + next.name + ' — ' + Game.formatPlanetEffects(next);
      } else {
        nextEl.textContent = '';
      }
    }
  }

  // ---------- 次の目標 ----------

  // 次の目標の優先順位:
  //   1. 未解放の建物がある → 最も達成に近い解放を1件
  //   2. ジャンプ可能       → 予想知識ポイント
  //   3. それ以外           → 次の建物マイルストーン と 脱出条件 を達成度で比較し、
  //                          達成に近い方(同率ならマイルストーン)を1件
  // 達成度はすべて正本(建物定義・Game.ESCAPE_REQUIREMENTS)から導出し、
  // この画面側で条件や倍率を二重定義しない。
  Game.getNextGoal = function (state) {
    var unlockGoal = null;
    Game.BUILDING_KEYS.forEach(function (key) {
      var progress = Game.getUnlockProgress(key, state);
      if (progress.done) return;
      if (!unlockGoal || progress.ratio > unlockGoal.ratio) {
        unlockGoal = {
          kind: 'unlock',
          ratio: progress.ratio,
          text: Game.BUILDING_DEFS[key].name + ' を解放 — ' + progress.text
            + '（' + progress.current + '/' + progress.required + '）',
        };
      }
    });
    if (unlockGoal) return unlockGoal;

    if (Game.canPrestige(state)) {
      return {
        kind: 'jump',
        ratio: 1,
        text: '惑星ジャンプ可能 — 予想知識 +' + Game.calcKnowledgeGain(state) + ' KP',
      };
    }

    var milestoneGoal = null;
    Game.BUILDING_KEYS.forEach(function (key) {
      var next = Game.getNextBuildingMilestone(key, state);
      if (!next) return;
      if (!milestoneGoal || next.ratio > milestoneGoal.ratio) {
        milestoneGoal = {
          kind: 'milestone',
          ratio: next.ratio,
          text: Game.BUILDING_DEFS[key].name + ' ' + next.count + '棟まであと' + next.remaining
            + '棟 — 達成で生産 ×' + next.multiplier.toFixed(2),
        };
      }
    });

    var escape = Game.getEscapeProgress(state);
    var escapeText = Object.keys(escape.resources).map(function (res) {
      var progress = escape.resources[res];
      return Game.RESOURCE_NAMES[res] + ' ' + Game.formatNumber(progress.current)
        + '/' + Game.formatNumber(progress.required);
    }).join(' ・ ');
    var escapeGoal = {
      kind: 'escape',
      ratio: escape.ratio,
      text: '脱出船 — ' + escapeText,
    };

    if (milestoneGoal && milestoneGoal.ratio >= escapeGoal.ratio) return milestoneGoal;
    return escapeGoal;
  };

  function renderNextGoal() {
    var el = document.getElementById('next-goal-text');
    if (!el) return;
    var goal = Game.getNextGoal(Game.state);
    el.textContent = goal ? goal.text : '—';
  }

  function renderSaveStatus(text) {
    document.getElementById('save-status').textContent = text || '';
  }
  Game.renderSaveStatus = renderSaveStatus;

  Game.render = function () {
    renderHeader();
    renderResources();
    renderClickArea();
    renderBuildings();
    renderSurvivors();
    renderPrestige();
    renderAchievements();
    renderNextGoal();
  };

  // ---------- モーダル ----------

  function openModal(mode) {
    Game.modalMode = mode;
    var overlay = document.getElementById('modal-overlay');
    var title = document.getElementById('modal-title');
    var textarea = document.getElementById('modal-textarea');
    var note = document.getElementById('modal-note');

    if (mode === 'export') {
      title.textContent = 'セーブコード(コピーして保存してください)';
      textarea.value = Game.encodeSaveCode(Game.state);
      textarea.readOnly = true;
      note.textContent = '※ 実績・統計はこのコードに含まれません(端末ごとのLocalStorageに保存されます)。';
      textarea.select();
    } else {
      title.textContent = 'セーブコードを読み込む';
      textarea.value = '';
      textarea.readOnly = false;
      note.textContent = '別端末で発行したコードを貼り付けてください。現在の進行状況は上書きされます。';
    }
    overlay.hidden = false;
  }

  function closeModal() {
    document.getElementById('modal-overlay').hidden = true;
    Game.modalMode = null;
  }

  function handleModalConfirm() {
    if (Game.modalMode === 'import') {
      var code = document.getElementById('modal-textarea').value;
      try {
        var imported = Game.decodeSaveCode(code);
        // 実績・統計はこの端末のものを維持する(ハイブリッド仕様)
        imported.achievements = Object.assign({}, Game.state.achievements);
        imported.stats = Object.assign({}, Game.state.stats);
        Game.state = imported;
        var offlineSec = Game.applyOfflineProgress(Game.state);
        Game.saveToLocalStorage();
        Game.render();
        Game.addLog('セーブコードを読み込みました' + (offlineSec > 0 ? '(放置分 ' + Math.floor(offlineSec / 60) + '分 を反映)' : ''));
      } catch (e) {
        window.alert('読み込みに失敗しました: ' + e.message);
        return;
      }
    }
    closeModal();
  }

  // ---------- イベントバインド ----------

  Game.initUI = function () {
    document.getElementById('btn-click').addEventListener('click', function () { Game.doManualClick(); });
    document.getElementById('btn-upgrade-click').addEventListener('click', function () { Game.buyClickUpgrade(); });
    document.getElementById('btn-accept-survivor').addEventListener('click', function () { Game.acceptSurvivor(); });

    document.getElementById('carry-plus').addEventListener('click', function () {
      var maxCarry = Math.min(Game.MAX_CARRY_SURVIVORS, Game.state.survivors.total);
      if (Game.carrySelection < maxCarry) Game.carrySelection += 1;
      Game.render();
    });
    document.getElementById('carry-minus').addEventListener('click', function () {
      if (Game.carrySelection > 0) Game.carrySelection -= 1;
      Game.render();
    });

    document.getElementById('btn-prestige').addEventListener('click', function () {
      if (!Game.canPrestige(Game.state)) return;
      var ok = window.confirm('脱出船を発進します。現在の建物・資源は失われますが、知識ポイントと同行させた生存者' + Game.carrySelection + '人は引き継がれます。よろしいですか?');
      if (!ok) return;
      Game.doPrestige(Game.carrySelection);
      Game.carrySelection = 0;
      Game.saveToLocalStorage();
    });

    document.getElementById('btn-export').addEventListener('click', function () { openModal('export'); });
    document.getElementById('btn-import').addEventListener('click', function () { openModal('import'); });
    document.getElementById('modal-confirm').addEventListener('click', handleModalConfirm);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);

    document.getElementById('btn-reset').addEventListener('click', function () {
      var ok = window.confirm('本当に最初からやり直しますか?この操作は取り消せません。');
      if (!ok) return;
      Game.state = Game.createInitialState();
      Game.carrySelection = 0;
      Game.saveToLocalStorage();
      Game.render();
      Game.addLog('コロニーの記録を消去し、最初からやり直します。');
    });
  };
})(window.Game = window.Game || {});

/* =========================================================
   main.js
   起動処理・ゲームループ・自動保存。
   ========================================================= */
(function (Game) {
  'use strict';

  function boot() {
    var loaded = Game.loadFromLocalStorage();
    Game.state = loaded || Game.createInitialState();

    if (loaded) {
      var offlineSeconds = Game.applyOfflineProgress(Game.state);
      if (offlineSeconds > 0) {
        var minutes = Math.floor(offlineSeconds / 60);
        Game.addLog('おかえりなさい。離脱していた間(約' + minutes + '分、上限あり)の生産を反映しました。');
      } else {
        Game.addLog('コロニーの記録を読み込みました。');
      }
    } else {
      Game.addLog('墜落した輸送船から、生存者たちが降り立った……');
    }

    Game.checkAchievements();
    Game.initUI();
    Game.render();
    Game.renderSaveStatus('準備完了');

    startLoop();
    startAutosave();

    window.addEventListener('beforeunload', function () {
      Game.saveToLocalStorage();
    });
  }

  // シミュレーションは1秒間に数回のtickで十分(アイドルゲームなので60fps不要)。
  // 毎フレームDOMを丸ごと再構築すると、ボタンが再生成され続けてクリックが
  // 取りこぼされる不具合につながるため、tick間隔=描画間隔として扱う。
  var TICK_INTERVAL_MS = 200;

  function startLoop() {
    var last = Date.now();
    setInterval(function () {
      var now = Date.now();
      var dt = (now - last) / 1000;
      last = now;
      // タブがバックグラウンドから復帰した際などの巨大なdtを防ぐ
      if (dt > 0 && dt < 5) {
        Game.tick(dt);
        Game.checkAchievements();
        Game.render();
      }
    }, TICK_INTERVAL_MS);
  }

  function startAutosave() {
    setInterval(function () {
      Game.saveToLocalStorage();
      Game.renderSaveStatus('自動保存済み ' + new Date().toLocaleTimeString('ja-JP'));
    }, Game.AUTOSAVE_INTERVAL_MS);
  }

  document.addEventListener('DOMContentLoaded', boot);
})(window.Game = window.Game || {});
</script>
